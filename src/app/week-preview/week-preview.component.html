<div class="container">
  <div class="calendar">
    <div class="calendar_nav">
      <span class="material-icons" (click)="onLeftArrow()">
      keyboard_arrow_left
      </span>
      <span>{{date | date}}</span>
      <span class="material-icons" (click)="onRightArrow()">
      keyboard_arrow_right
      </span>
    </div>
    <ul>
      <li *ngFor="let day of arrDays; index as i" [class.active]="i === date.getDay()">
        <span>{{day}}</span>
      </li>
    </ul>
  </div>

  <div class="total">Daily total: {{totalHours | date:'HH:mm'}}</div>
  <div class="container_task task" *ngFor="let task of tasks">

    <div class="content">
      <div class="text">
        <div class="task_name">{{task.name}}</div>
        <div class="task_note">{{task.comment}}</div>
      </div>
      <div class="task_duration">{{task.duration | date:'HH:mm'}}</div>
      <div class="buttons">
        <div class="button" [routerLink]="['/edit/' + task.id]">
                <span class="material-icons">
                  edit
                </span>
        </div>
        <div class="button" (click)="onDelete(task.id)" >
                <span class="material-icons">
                  delete_forever
                </span>
        </div>
      </div>

    </div>
    <div class="hidden_content">
      <div class="time">
        <div class="task_time">
          <div>{{task.start.toDate() | date:'HH:mm'}}</div>
          <div>{{task.stop.toDate() | date:'HH:mm'}}</div>
        </div>
        <div class="pause"></div>
      </div>
    </div>
