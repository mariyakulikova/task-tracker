<div class="container">
  <div class="container__inner">
    <div class="calendar_nav">
      <span class="material-icons" (click)="onLeftArrow()">
      keyboard_arrow_left
      </span>
      <span>{{date | date}}</span>
      <span class="material-icons" (click)="onRightArrow()">
      keyboard_arrow_right
      </span>
    </div>
    <ul *ngFor="let day of arrDays; index as i">
      <li [class.active]="i === date.getDay()">
        <span>{{day}}</span>
      </li>

    </ul>
  </div>
  <div class="container_task">

      <span class="task_name">Task name</span>
      <div class="task_inner">
        <span>Time: 00:10</span>
        <div class="edit_button">
          <span class="material-icons">
            edit
          </span>
        </div>
      </div>



  </div>
  <div class="add_info">
    <div class="info">
      <span>Started</span>
      <span>20.07.2020 17:00</span>
    </div>
    <div class="info">
      <span>Ended</span>
      <span>20.07.2020 17:10</span>
    </div>
  </div>

  <div class="container_task">

    <span class="task_name">Task name2</span>
    <div class="task_inner">
      <span>Time: 00:15</span>
      <div class="edit_button">
          <span class="material-icons">
            edit
          </span>
      </div>
    </div>



  </div>


</div>
