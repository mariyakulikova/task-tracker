<div class="container">
  <div class="button button-google"
       (click)="singInWithGoogle()">
    log in with Google</div>
  <hr>
  <span class="text">OR</span>
  <small>Login</small>
  <input class="input" type="email" [(ngModel)]="email">
  <small>Password</small>
  <input class="input" type="password" [(ngModel)]="password">
  <div class="container-button">
    <div class="button" (click)="login()">Log in</div>
    <div class="button" (click)="signUp()">Sing up</div>
  </div>
  <div class="firebaseui-error">
    <span *ngIf="hasError">{{errorMessage}}</span>
  </div>


</div>
