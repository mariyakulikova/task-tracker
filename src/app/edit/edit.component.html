<div class="container">
  <form [formGroup]="form" >
    <div class="container__inner span">
      <span>Log Time</span>
    </div>
    <div class="container__inner">
      <small>Task</small>
      <input [formControlName]="'name'" type="text" class="task_name"
             [class.is-invalid]="form.get('name').invalid && form.get('name').touched">
    </div>

    <div class="container__inner">
      <small>Notes</small>
      <textarea [formControlName]="'note'" class="notes" name="" id="" cols="30" rows="5" placeholder="Notes (optional)"></textarea>
    </div>

    <div class="container__inner">
      <small>Date</small>
      <input [formControlName]="'date'" type="date"
             [class.is-invalid]="form.get('date').invalid && form.get('date').touched">
    </div>

    <div class="container__time">
      <div class="from_to">
        <small>From</small>
        <input [formControlName]="'start'" type="time"
               [class.is-invalid]="form.get('start').invalid && form.get('start').touched">
      </div>
      <div class="from_to">
        <small>To</small>
        <input [formControlName]="'stop'" type="time"
               [class.is-invalid]="form.get('stop').invalid && form.get('stop').touched">
      </div>
    </div>

<!--    <div class="container__inner">-->
<!--      <small>Duration</small>-->
<!--      <div class="duration">{{showDuration()}}</div>-->
<!--    </div>-->

    <div class="container__button">
      <button (click)="onCancel()">Cancel</button>
      <button (click)="onSave()">Save</button>
    </div>
  </form>
</div>
